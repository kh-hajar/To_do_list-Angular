<div class="container mt-5">
  <h2 class="text-center mb-4">📝 My To-Do List</h2>

  <div class="input-group mb-3">
    <input [(ngModel)]="task" type="text" class="form-control" placeholder="New task">
    <button (click)="addTask()" class="btn btn-primary">
  {{ editIndex !== null ? 'Update' : 'Add' }}</button>
  </div>

  
  <div *ngIf="tasks.length === 0" class="text-center">
    <img src="https://cdn-icons-png.flaticon.com/512/4076/4076549.png" width="140" alt="Empty list">
    <p class="text-muted mt-3">No tasks... Add one above 👆</p>
  </div>

  
  <ul class="list-group" *ngIf="tasks.length > 0">
    <li *ngFor="let t of tasks; let i = index"
        class="list-group-item d-flex justify-content-between align-items-center"
        [ngClass]="{ 'text-success': t.done, 'text-decoration-line-through': t.done }">

      <div class="d-flex align-items-center">
        <input type="checkbox" class="form-check-input me-2" (change)="toggleDone(i)" [checked]="t.done">
        {{ t.text }}
      </div>

      <div>
        <button class="btn btn-sm btn-warning me-2" (click)="editTask(i)">✏️</button>
        <button class="btn btn-sm btn-danger" (click)="deleteTask(i)">🗑️</button>
      </div>
    </li>
  </ul>
</div>
